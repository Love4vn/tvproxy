name: Tự Động Săn Link Bóng Đá Hằng Ngày

on:
  schedule:
    - cron: '* */2 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-football-bot]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kéo mã nguồn về máy chủ
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt vũ khí Playwright & Requests
        run: |
          pip install playwright requests
          playwright install chromium

      - name: Kích hoạt Siêu Bot đi săn link
        run: python -u san_link_bong_da.py

      - name: Đẩy file m3u mới lên kho chứa công khai
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com"

          git add tong_hop_bong_da.m3u
          if git diff --cached --quiet; then
            echo "Không có thay đổi, bỏ qua commit."
            exit 0
          fi

          git commit -m "Cập nhật luồng trực tiếp mới nhất [skip ci]"

          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push fail lần $i, thử lại..."
            sleep 5
          done

          echo "Push thất bại sau 3 lần thử" >&2
          exit 1
