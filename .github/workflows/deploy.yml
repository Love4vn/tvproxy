name: Auto Update Xoilac Headers and Deploy

on:
  #schedule:
  #  - cron: '0 */6 * * *' # Tự động chạy mỗi 6 tiếng một lần
  workflow_run:
    workflows:
      - "Tự Động Săn Link Bóng Đá Hằng Ngày"
    types:
      - completed
  workflow_dispatch:      # Cho phép bấm nút chạy thủ công trên GitHub
  
permissions:
  contents: write
  
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Update Script
        run: python update_headers.py

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: 'latest' # <-- THÊM DÒNG NÀY ĐỂ DÙNG BẢN MỚI NHẤT
          command: deploy worker.js --name hls-proxy --compatibility-date 2024-03-20
