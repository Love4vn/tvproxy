name: Sportsonline Scraper (M3U)

on:
  schedule:
    - cron: '30 */3 * * *'   # Chạy mỗi 3 giờ
  workflow_dispatch:          # Cho phép chạy thủ công

permissions:
  contents: write             # Cho phép bot ghi file vào Repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Run Sportsonline Scraper
        env:
          SPORTSONLINE: ${{ secrets.SPORTSONLINE }}
        run: |
          python sportsonline_api.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sportsonline.m3u
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Sportsonline M3U [skip ci]"
            git push
          fi
