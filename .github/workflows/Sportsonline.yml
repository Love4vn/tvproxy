name: Sportsonline Scraper (M3U for TiviMate & Kodi)

on:
  schedule:
    - cron: '30 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Playwright Chromium + system deps
        run: |
          python -m playwright install --with-deps chromium
          
      - name: Run Sportsonline Scraper
        env:
          SPORTSONLINE: ${{ secrets.SPORTSONLINE }}
        run: |
          python sportsonline_api.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sportsonline_tivimate.m3u sportsonline_kodi.m3u
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Sportsonline M3U (TiviMate + Kodi) [skip ci]"
            git push
          fi
