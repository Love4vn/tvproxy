name: Update SportsOnline M3U

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run script
        env:
          SPORTSONLINE: ${{ secrets.SPORTSONLINE }}
        run: |
          rm -f sportsonline_live_streams.m3u
          python sportsonline_api.py
          echo "----- Kiểm tra file -----"
          ls -la sportsonline_live_streams.m3u || echo "FILE KHÔNG TỒN TẠI"
          wc -l sportsonline_live_streams.m3u || true

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git diff --cached --stat
          git commit -m "Update M3U $(date -u +%Y-%m-%d_%H-%M)" || echo "No changes to commit"
          git push
